# 星垣 - 监控端 Docker Compose 配置
# Author: tan91
# GitHub: https://github.com/NUDTTAN91
# Project: https://github.com/NUDTTAN91/xingyuan

version: '3.8'

services:
  # 监控端服务
  xingyuan-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    # image: xingyuan/monitor:latest
    container_name: xingyuan-monitor
    hostname: xingyuan-monitor
    restart: unless-stopped
    
    # 使用宿主机网络模式，直接访问宿主机网卡
    network_mode: host
    
    # 注意：host网络模式下不需要ports映射
    
    # 挂载宿主机目录以访问真实系统信息
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro  # 挂载Docker Socket（只读）
      - ./data:/app/data  # 挂载数据目录，存储监控历史数据
    
    # 环境变量
    environment:
      - TZ=Asia/Shanghai
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ROOT=/host
      - SERVER_PORT=81  # 服务端口，可以自定义修改
      
      # 登录认证配置
      - ADMIN_USERNAME=root                     # 管理员用户名
      - ADMIN_PASSWORD=root                     # 管理员密码（请修改为强密码）
      - JWT_SECRET=xingyuan-secret-key-please-change-this-in-production  # JWT密钥（请修改）
      - ACCESS_TOKEN_EXPIRE_MINUTES=120         # Access Token有效期（2小时）
      - REFRESH_TOKEN_EXPIRE_DAYS=7             # Refresh Token有效期（7天）
      - MAX_LOGIN_ATTEMPTS=5                    # 最大登录失败次数
      - LOGIN_LOCK_MINUTES=15                   # 登录锁定时间（分钟）
    
    # 特权模式以访问宿主机信息
    privileged: true
    pid: host
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    
    # 健康检查
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://localhost:$${SERVER_PORT}/api/metrics"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
